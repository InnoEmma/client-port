          fill="#140018"/>

    <!-- Birds -->
    <g fill="none" stroke="#140018" stroke-linecap="round" opacity="0.55">
      <path d="M660 500 c8 -10 17 -10 25 0 c8 -10 17 -10 25 0" stroke-width="5"/>
      <path d="M320 540 c6 -8 13 -8 19 0 c6 -8 13 -8 19 0"   stroke-width="4"/>
