<svg width="1020" height="1020" viewBox="0 0 1020 1020" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sunburst over hills">
  <defs>
    <clipPath id="frame">
      <rect width="1020" height="1020" rx="96"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Background -->
    <rect width="1020" height="1020" fill="#DBE8FB"/>

    <!-- Scattered stars -->
    <g fill="#140018">
      <circle cx="130" cy="170" r="3"   opacity="0.35"/>
      <circle cx="230" cy="90"  r="2"   opacity="0.28"/>
      <circle cx="345" cy="210" r="2.5" opacity="0.32"/>
      <circle cx="780" cy="140" r="3"   opacity="0.36"/>
      <circle cx="880" cy="215" r="2"   opacity="0.30"/>
      <circle cx="930" cy="110" r="2.5" opacity="0.34"/>
      <circle cx="80"  cy="300" r="2"   opacity="0.26"/>
      <circle cx="960" cy="330" r="2"   opacity="0.28"/>
      <circle cx="200" cy="430" r="1.8" opacity="0.22"/>
      <circle cx="830" cy="450" r="1.8" opacity="0.22"/>
    </g>

    <!-- Sun rays -->
    <g fill="#140018" opacity="0.35">
      <path d="M650 438 L740 420 L650 402 Z"/>
      <path d="M631.24 365.59 L709.18 305 L622.24 334.41 Z"/>
      <path d="M595.59 307.76 L625 220.82 L564.41 289.76 Z"/>
      <path d="M528 280 L510 190 L492 280 Z"/>
      <path d="M455.59 307.76 L395 220.82 L424.41 289.76 Z"/>
      <path d="M397.76 365.59 L310.82 305 L379.76 334.41 Z"/>
      <path d="M370 438 L280 420 L370 402 Z"/>
      <path d="M379.76 474.41 L310.82 535 L397.76 505.59 Z"/>
      <path d="M424.41 532.24 L395 619.18 L455.59 550.24 Z"/>
      <path d="M492 560 L510 650 L528 560 Z"/>
      <path d="M564.41 532.24 L625 619.18 L595.59 550.24 Z"/>
      <path d="M622.24 474.41 L709.18 535 L640.24 505.59 Z"/>
    </g>

    <!-- Sun -->
    <circle cx="510" cy="420" r="110" fill="#140018"/>

    <!-- Inner glow ring -->
    <circle cx="510" cy="420" r="82"  fill="#DBE8FB" opacity="0.08"/>
    <circle cx="510" cy="420" r="54"  fill="#DBE8FB" opacity="0.10"/>

